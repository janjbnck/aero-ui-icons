<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <radialGradient id="back-forward-body" cx="0.5" cy="0.9" r="0.75">
      <stop offset="0" stop-color="#86dcff"/>
      <stop offset="0.45" stop-color="#3a8fe2"/>
      <stop offset="1" stop-color="#1b4c9c"/>
    </radialGradient>
    <linearGradient id="back-forward-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="back-forward-arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d2e6fa"/>
    </linearGradient>
    <filter id="back-forward-blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <g id="back-forward-button">
      <circle r="10.5" fill="url(#back-forward-body)" stroke="#1a3d74" stroke-width="0.8"/>
