      <ellipse cy="-4.6" rx="7.6" ry="5.2" fill="url(#back-forward-gloss)"/>
    </g>
    <path id="back-forward-left" d="M-7.5 0L-1.5 -5.5V-2.3H7V2.3H-1.5V5.5Z" stroke-linejoin="round"/>
  </defs>
  <ellipse cx="24" cy="46" rx="10" ry="1.2" fill="#000000" opacity="0.25" filter="url(#back-forward-blur)"/>
  <use href="#back-forward-button" x="24" y="13"/>
  <use href="#back-forward-button" x="24" y="35"/>
  <use href="#back-forward-left" x="24" y="13.7" fill="#0b2f66" opacity="0.35"/>
