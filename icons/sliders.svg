      <rect x="-2.4" y="-4.9" width="4.8" height="9.8" rx="1.1" stroke="#ffffff" stroke-width="0.4" opacity="0.8"/>
      <path d="M-0.8 -2V2M0.8 -2V2" stroke="#8f959c" stroke-width="0.4"/>
