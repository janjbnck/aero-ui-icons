      <stop offset="0" stop-color="#5f656c"/>
      <stop offset="1" stop-color="#a3a9b0"/>
    </linearGradient>
    <linearGradient id="sliders-thumb" gradientUnits="userSpaceOnUse" x1="0" y1="-5.5" x2="0" y2="5.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#eef0f2"/>
      <stop offset="0.5" stop-color="#d8dce0"/>
